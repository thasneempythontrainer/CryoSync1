# Runtime configuration for the CryoSync Databricks App.
# The Databricks Apps platform automatically injects DATABRICKS_APP_PORT,
# DATABRICKS_HOST, DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET (for the
# app's service principal), so the backend's OAuth token refresh and the
# Databricks Model Serving / Lakebase calls work without any credentials here.

command:
  - python
  - run_server.py

env:
  # Databricks workspace + model serving (DATABRICKS_HOST is auto-injected).
  - name: DATABRICKS_ENDPOINT
    value: databricks-meta-llama-3-3-70b-instruct

  # Lakebase (provisioned) PostgreSQL - non-secret connection config.
  # Secrets are never stored here: the DB password is minted at runtime via
  # POST /api/2.0/postgres/credentials using the app service principal.
  - name: DATABRICKS_DB_HOST
    value: ep-bitter-frog-d8048hup.database.us-east-2.cloud.databricks.com
  - name: DATABRICKS_DB_PORT
    value: "5432"
  - name: DATABRICKS_DB_NAME
    value: proreactapp
  # Username used in the connection string. Locally this is the Databricks
  # user email; for the deployed app set it to the app service principal's
  # name if the default user cannot connect.
  - name: DATABRICKS_DB_USER
    value: thasneem.moosa@abilytics.com
  - name: DATABRICKS_DB_ENDPOINT
    value: projects/proreact/branches/production/endpoints/primary
