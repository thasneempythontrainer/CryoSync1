# Declarative Automation Bundle for CryoSync.
#
# Deploy (creates the app + uploads source):
#   databricks auth login --host https://dbc-2a25661e-3f93.cloud.databricks.com
#   databricks bundle validate
#   databricks bundle deploy
#
# Start/restart the app on compute (required after deploy so code takes effect):
#   databricks bundle run cryosync
#
# Requires Databricks CLI >= 0.239.0 and the Databricks Apps + Lakebase
# previews enabled in the workspace. See the bundle `apps` resource reference.

bundle:
  name: cryosync

# Files to exclude from the source upload (bundle sync also honours .gitignore,
# which already excludes node_modules/, dist/ and .env). dist/ is regenerated
# by the app deploy pipeline via `npm run build`.
sync:
  exclude:
    - "**/__pycache__"
    - "**/*.pyc"
    - "*.pptx"
    - "*.pptx.bak"
    - "r.txt"
    - "README.mdgit"
    - "app-summary.txt"
    - ".oxlintrc.json"
    - "components.json"
    - "tsconfig.tsbuildinfo"
    - "backend/test_*.py"

resources:
  apps:
    # Key used with `databricks bundle run`; `name` is the app shown in the
    # Databricks Apps UI.
    cryosync:
      name: cryosync
      description: "CryoSync - Cold-Chain Intelligence Platform"
      source_code_path: "."
      # Uncomment to let all workspace users open the app:
      # permissions:
      #   - level: CAN_USE
      #     group_name: users

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-2a25661e-3f93.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://dbc-2a25661e-3f93.cloud.databricks.com
      # Resolves to the authenticated identity's home folder, so local deploys
      # (user) and CI deploys (service principal) each keep their own state.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
