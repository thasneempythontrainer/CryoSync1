# Databricks Assets Bundle for CryoSync (analytic layer).
#
# Deploys a scheduled Job that refreshes the Silver/Gold analytical tables that
# back the dashboards and Databricks Genie. The CryoSync web app itself is
# deployed by .github/workflows/deploy.yml via `databricks apps`.
#
# Required GitHub secrets (see workflow): DATABRICKS_HOST, DATABRICKS_CLIENT_ID,
# DATABRICKS_CLIENT_SECRET.

bundle:
  name: cryosync

variables:
  workspace_host:
    description: Databricks workspace host URL
    default: https://dbc-2a25661e-3f93.cloud.databricks.com
  catalog:
    description: Unity Catalog name for CryoSync data
    default: cryosync_catalog

workspace:
  host: ${var.workspace_host}

targets:
  prod:
    mode: production
    workspace:
      host: ${var.workspace_host}
      root_path: /Shared/cryosync/prod
    resources:
      jobs:
        cryosync_analytics_transform:
          name: CryoSync analytics transform (Silver/Gold)
          # Once Bronze is seeded, UNPAUSE and it runs nightly at 02:00 UTC.
          schedule:
            quartz_cron_expression: "0 0 2 * * ?"
            timezone_name: UTC
            pause_status: PAUSED
          tasks:
            - task_key: transform
              notebook_task:
                notebook_path: /Shared/cryosync/prod/notebooks/build_silver_gold
                source: WORKSPACE
              job_cluster_key: shared
          job_clusters:
            - job_cluster_key: shared
              new_cluster:
                spark_version: "15.4.x-scala2.12"
                node_type_id: i3.xlarge
                num_workers: 1
                data_security_mode: SINGLE_USER
                spark_conf:
                  spark.sql.shuffle.partitions: "4"
